info:
  name: "[GET] api/v1/admin/financial-dashboard/payouts/{payout}"
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/v1/admin/financial-dashboard/payouts/:payout"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: payout
      value: "{{payout_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
