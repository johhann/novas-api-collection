info:
  name: "[GET] api/v1/admin/branches"
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/admin/branches?page=1&limit=3"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "3"
      type: query
    - name: status
      value: inactive
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Parse response
        const res = res.getBody();

        // Validate response structure
        test("Response is successful", function () {
            expect(res.success).to.be.true;
            expect(res.status).to.equal(200);
        });

        // Check if branch data exists
        test("Branches exist", function () {
            expect(res.data).to.have.property("data");
            expect(res.data.data.length).to.be.greaterThan(0);
        });

        // Extract first branch ID
        if (res.data && res.data.data && res.data.data.length > 0) {
            const firstBranch = res.data.data[0];
            const branchId = firstBranch.id;

            // Store in environment variable
            bru.setEnvVar("branchId", branchId);

            console.log("Branch ID saved:", branchId);

            test("Branch ID stored successfully", function () {
                expect(branchId).to.be.a("string");
            });
        } else {
            console.warn("No branches found in response");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
