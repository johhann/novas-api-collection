opencollection: 1.0.0

info:
  name: Novas
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  variables:
    - name: base_url
      value: http://gojo-backend.test
  scripts:
    - type: before-request
      code: |-
        // Set Accept header to application/json
        req.setHeader('Accept', 'application/json');

        req.setHeader('Content-Type', 'application/json');

