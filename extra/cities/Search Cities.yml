info:
  name: Search Cities
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/extra/cities?search=city name"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: search
      value: city name
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
