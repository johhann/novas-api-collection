info:
  name: "[GET] api/v1/extra/cities"
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/extra/cities"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: X-Locale
      value: en
      description: en, am
    - name: X-Locale-All
      value: "true"
      description: returns all locales if true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
