info:
  name: "[POST] api/v1/auth/verify"
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/verify"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: multipart-form
    data:
      - name: code
        type: text
        value: "175259"
  auth:
    type: bearer
    token: "{{verificationToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        const token = response.data.access_token;
        const refreshToken = response.data.refresh_token;
        bru.setEnvVar('token', token);
        bru.setEnvVar('refresh_token', refreshToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
