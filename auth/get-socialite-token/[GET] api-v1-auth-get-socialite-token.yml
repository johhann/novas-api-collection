info:
  name: "[GET] api/v1/auth/get-socialite-token"
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/auth/get-socialite-token"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        const token = response.data.token;
        if (token) {
            bru.setEnvVar('socialiteToken', token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
