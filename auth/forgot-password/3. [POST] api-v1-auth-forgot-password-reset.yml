info:
  name: 3. [POST] api/v1/auth/forgot-password/reset
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/forgot-password/reset"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: multipart-form
    data:
      - name: new_password
        type: text
        value: Pass@word12
      - name: new_password_confirmation
        type: text
        value: Pass@word12
      - name: log_out_other_devices
        type: text
        value: "1"
  auth: inherit

settings:
