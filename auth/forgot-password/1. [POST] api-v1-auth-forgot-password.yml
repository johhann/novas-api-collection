info:
  name: 1. [POST] api/v1/auth/forgot-password
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/forgot-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "email": "admin@gojo.com"
          // "phone": 251914141414
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        const token = response.data.token;
        if (token) {
            bru.setEnvVar('verificationToken', token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
